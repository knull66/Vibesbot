<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIBESBOT</title>
    <link rel="stylesheet" href="/static/styles.css?v=1.51.0">
</head>
<body class="auth-wait" data-view="signal">
    <div class="app">
        <header class="header">
            <div class="brand"><span class="brand-name">VIBESBOT</span></div>
            <div class="controls">
                <div class="stake-chips" id="stake-chips" role="group" aria-label="Quick stake">
                    <button type="button" class="stake-chip" data-stake="1">$1</button>
                    <button type="button" class="stake-chip" data-stake="5">$5</button>
                    <button type="button" class="stake-chip" data-stake="10">$10</button>
                    <button type="button" class="stake-chip" data-stake="50">$50</button>
                </div>
            </div>
        </header>
        <footer class="footer"><div class="footer-brand">VIBESBOT <span id="app-version">v1.51.0</span></div></footer>
    </div>
    <script src="/static/app.js?v=1.51.0"></script>
</body>
</html>
