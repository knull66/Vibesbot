<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIBESBOT COMPANION</title>
    <meta name="theme-color" content="#070809">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="stylesheet" href="/static/styles.css?v=1.29.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <div class="lobby">
        <div class="lobby-hero">
            <div class="brand-icon lobby-logo">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
            <div class="brand-name">VIBESBOT</div>
            <p class="lobby-kicker">MAC COMPANION</p>
            <p class="lobby-copy">Pair this phone with the Mac app on the same Wi-Fi.</p>
        </div>

        <div class="login-card">
            <p class="settings-hint" id="pair-hint">This phone cannot run the bot. Pair it with the Mac app on the same Wi-Fi.</p>
            <form id="pair-form">
                <div class="form-group">
                    <label for="pin">Pairing code</label>
                    <input type="text" id="pin" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
                </div>
                <button class="btn btn-primary" type="submit" id="pair-submit" style="width:100%;">Pair</button>
                <div class="login-error" id="pair-error"></div>
            </form>
        </div>
    </div>
    <script>
    (function () {
        const hint = document.getElementById('pair-hint');
        const errorEl = document.getElementById('pair-error');
        const submit = document.getElementById('pair-submit');
        fetch('/api/companion/status').then(r => r.json()).then(data => {
            if (data.is_local) {
                window.location.href = '/';
                return;
            }
            if (data.setup_required) {
                hint.textContent = 'Open Vibesbot on your Mac and create the owner account first.';
                submit.disabled = true;
                return;
            }
            if (!data.enabled) {
                hint.textContent = 'Companion is off. On the Mac go to Settings → ACCOUNT and enable Companion.';
                submit.disabled = true;
            }
        });
        document.getElementById('pair-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.textContent = '';
            submit.disabled = true;
            try {
                const res = await fetch('/api/companion/pair', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: document.getElementById('pin').value })
                });
                const data = await res.json();
                if (!res.ok || !data.success) {
                    errorEl.textContent = data.error || 'Pairing failed';
                    submit.disabled = false;
                    return;
                }
                window.location.href = '/';
            } catch (err) {
                errorEl.textContent = 'Mac app is not reachable. Same Wi-Fi?';
                submit.disabled = false;
            }
        });
    })();
    </script>
</body>
</html>
