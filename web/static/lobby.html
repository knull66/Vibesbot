<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIBESBOT</title>
    <meta name="theme-color" content="#070809">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="stylesheet" href="/static/styles.css?v=1.21.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <div class="lobby">
        <div class="lobby-hero">
            <div class="brand-icon lobby-logo">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
            <div class="brand-name">VIBESBOT</div>
            <p class="lobby-kicker" id="login-tag">Prediction radar</p>
            <p class="lobby-copy">Your desk. Your stats. Sign in to continue.</p>
            <p class="boot-version">v1.21.0</p>
        </div>

        <div class="login-card">
            <div class="login-tabs" id="login-tabs">
                <button class="login-tab active" data-mode="login">Sign in</button>
                <button class="login-tab" data-mode="register" id="tab-register">Register</button>
            </div>

            <form id="auth-form" autocomplete="on">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" maxlength="24" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" minlength="8" required>
                </div>
                <div class="form-group" id="invite-group" style="display:none;">
                    <label for="invite">Invite code</label>
                    <input type="text" id="invite" name="invite" placeholder="VIBE-XXXX-XXXX">
                </div>
                <button class="btn btn-primary" type="submit" id="auth-submit" style="width:100%;" disabled>Enter</button>
                <button class="btn" type="button" id="btn-retry-engine" style="width:100%;margin-top:10px;display:none;">Retry</button>
                <div class="login-error" id="auth-error"></div>
                <p class="settings-hint" id="auth-hint"></p>
            </form>
        </div>
    </div>
    <script src="/static/auth-gate.js?v=1.21.0"></script>
</body>
</html>
