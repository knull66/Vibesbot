<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(92, 242, 255, 0.16) 0%, transparent 55%),
        #070809;
    color: #5CF2FF;
    font-family: 'Press Start 2P', monospace;
}
.orb {
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(92, 242, 255, 0.18), transparent 70%);
    filter: blur(18px);
    animation: breathe 2.8s ease-in-out infinite;
}
@keyframes breathe {
    0%, 100% { transform: scale(0.86); opacity: 0.45; }
    50% { transform: scale(1.12); opacity: 0.9; }
}
.wrap { position: relative; z-index: 2; text-align: center; }
.brand-icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 28px;
    background: rgba(0, 0, 0, 0.45);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: 1px solid rgba(92, 242, 255, 0.4);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 0 28px rgba(92, 242, 255, 0.2);
    position: relative;
}
.brand-icon::after {
    content: '';
    position: absolute;
    left: 10px;
    right: 10px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #5CF2FF, transparent);
    animation: scan 1.6s ease-in-out infinite;
}
@keyframes scan {
    0% { top: 12px; opacity: 0; }
    30% { opacity: 1; }
    100% { top: 58px; opacity: 0; }
}
.eye {
    width: 16px;
    height: 4px;
    border-radius: 99px;
    background: #5CF2FF;
    box-shadow: 0 0 10px #5CF2FF;
    animation: blink 4.5s infinite;
}
@keyframes blink {
    0%, 92%, 100% { opacity: 1; transform: scaleY(1); }
    95% { opacity: 0.2; transform: scaleY(0.15); }
}
.title {
    font-size: 16px;
    letter-spacing: 4px;
    margin-bottom: 14px;
}
.subtitle {
    font-size: 8px;
    color: rgba(244,247,250,0.48);
    letter-spacing: 3px;
    margin-bottom: 28px;
}
.version {
    font-size: 8px;
    color: rgba(92, 242, 255, 0.7);
    margin-bottom: 22px;
}
.loader {
    width: 196px;
    height: 6px;
    margin: 0 auto;
    background: rgba(255,255,255,0.08);
    border-radius: 99px;
    overflow: hidden;
    border: 1px solid rgba(92, 242, 255, 0.18);
}
.loader-bar {
    width: 38%;
    height: 100%;
    background: linear-gradient(90deg, transparent, #5CF2FF, transparent);
    animation: load 1.15s ease-in-out infinite;
}
@keyframes load {
    0% { transform: translateX(-120%); }
    100% { transform: translateX(320%); }
}
.status {
    margin-top: 20px;
    font-size: 8px;
    color: rgba(244,247,250,0.4);
    letter-spacing: 2px;
}
</style>
</head>
<body>
<div class="orb"></div>
<div class="wrap">
    <div class="brand-icon">
        <div class="eye"></div>
        <div class="eye"></div>
    </div>
    <div class="title">VIBESBOT</div>
    <div class="subtitle">PREDICTION RADAR</div>
    <div class="version">v{{VERSION}}</div>
    <div class="loader"><div class="loader-bar"></div></div>
    <div class="status">BOOTING</div>
</div>
</body>
</html>
