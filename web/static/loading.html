<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #1c1c1e;
    color: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    -webkit-app-region: drag;
}
.wrap { text-align: center; }
.title {
    font-size: 20px;
    font-weight: 590;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
}
.version {
    font-size: 12px;
    color: #8e8e93;
    margin-bottom: 22px;
}
.loader {
    width: 168px;
    height: 4px;
    margin: 0 auto;
    background: #3a3a3c;
    border-radius: 99px;
    overflow: hidden;
}
.loader-bar {
    width: 36%;
    height: 100%;
    background: #0a84ff;
    animation: load 1.1s ease-in-out infinite;
}
@keyframes load {
    0% { transform: translateX(-120%); }
    100% { transform: translateX(320%); }
}
.status {
    margin-top: 16px;
    font-size: 12px;
    color: #8e8e93;
}
</style>
</head>
<body>
<div class="wrap">
    <div class="title">Vibesbot</div>
    <div class="version">v{{VERSION}}</div>
    <div class="loader"><div class="loader-bar"></div></div>
    <div class="status">Starting</div>
</div>
</body>
</html>
